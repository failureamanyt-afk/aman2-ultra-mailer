<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMAN2 - Security Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #121212; color: #f1f1f1; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .neon-border { box-shadow: 0 0 15px rgba(0, 229, 255, 0.3); }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen px-4">
  <div class="w-full max-w-md bg-[#1e1e1e] border border-[#333333] rounded-xl p-8 neon-border">
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-[#00E5FF]/10 text-[#00E5FF] text-2xl mb-3">
        <i class="fa-solid fa-paper-plane"></i>
      </div>
      <h1 class="text-2xl font-bold tracking-wider text-[#00E5FF]">AMAN2 ULTRA</h1>
      <p class="text-xs text-gray-400 mt-1">Anti-Detect Universal Cloud Mailer</p>
    </div>

    {% if error %}
    <div class="bg-red-900/40 border border-red-500/50 text-red-300 text-sm px-4 py-3 rounded-lg mb-4 text-center">
      <i class="fa-solid fa-triangle-exclamation mr-1"></i> {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/login" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-1">Username</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500"><i class="fa-solid fa-user text-sm"></i></span>
          <input type="text" name="username" required placeholder="Enter username" class="w-full pl-10 pr-3 py-2 bg-[#2a2a2a] border border-[#444] rounded-lg text-white text-sm focus:outline-none focus:border-[#00E5FF]">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-1">Password</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500"><i class="fa-solid fa-lock text-sm"></i></span>
          <input type="password" name="password" required placeholder="Enter password" class="w-full pl-10 pr-3 py-2 bg-[#2a2a2a] border border-[#444] rounded-lg text-white text-sm focus:outline-none focus:border-[#00E5FF]">
        </div>
      </div>

      <button type="submit" class="w-full py-2.5 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold rounded-lg transition duration-200 shadow-lg text-sm flex items-center justify-center gap-2">
        <i class="fa-solid fa-arrow-right-to-bracket"></i> Login to Portal
      </button>
    </form>

    <div class="mt-6 pt-4 border-t border-[#2d2d2d] text-center text-xs text-gray-500">
      Universal Access Portal | Protected by AMAN2 Anti-Detect Shield
    </div>
  </div>
</body>
</html>
